<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alex Hats · Catálogo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#000;--ink:#fff;--mute:#a8a8a8;--line:#2a2a2a;--card:#0e0e0e;--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:28px 18px 120px}
header{text-align:center}
header img{width:min(62vw,260px);height:auto;display:block;margin:0 auto}
.aviso{font-family:"Permanent Marker",cursive;font-size:clamp(.95rem,3.6vw,1.2rem);line-height:1.35;margin:18px auto 0;max-width:38ch;border:3px solid var(--ink);border-radius:14px;padding:14px 16px;transform:rotate(-1.2deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin:34px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.foto{aspect-ratio:1/1;background:#151515;display:grid;place-items:center;color:var(--mute);font-size:.9rem;text-align:center;padding:12px}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h2{margin:0;font-size:1.02rem;font-weight:600}
.precio{font-family:"Permanent Marker",cursive;font-size:1.6rem}
.pedir{margin-top:auto;display:block;text-align:center;text-decoration:none;background:var(--ink);color:#000;font-weight:800;border-radius:10px;padding:10px;min-height:44px}
.pedir:focus-visible,.red:focus-visible,.fab:focus-visible{outline:3px solid var(--wa);outline-offset:3px}
footer{border-top:2px solid var(--line);padding-top:26px;text-align:center}
footer h3{font-family:"Permanent Marker",cursive;font-size:1.5rem;margin:0 0 6px;font-weight:400}
.tel{font-size:1.25rem;font-weight:800;color:var(--ink);text-decoration:none}
.redes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.red{color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:9px 16px;min-height:44px;display:inline-flex;align-items:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wa);color:#000;font-weight:800;text-decoration:none;border-radius:999px;padding:14px 24px;min-height:48px;box-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap}
</style>
</head>

function wa(txt){return "https://wa.me/"+CELULAR+"?text="+encodeURIComponent(txt)}
var g=document.getElementById("grid");
GORRAS.forEach(function(p){
  var c=document.createElement("article");c.className="card";
  var f=document.createElement("div");f.className="foto";
  if(p.foto){var i=document.createElement("img");i.src=p.foto;i.alt=p.nombre;f.appendChild(i)}else{f.textContent="Aquí va la foto"}
  var n=document.createElement("div");n.className="info";
  var h=document.createElement("h2");h.textContent=p.nombre;
  var pr=document.createElement("div");pr.className="precio";pr.textContent=p.precio;
  var a=document.createElement("a");a.className="pedir";a.textContent="Pedir esta gorra";a.href=wa("Hola Alex, quiero pedir: "+p.nombre+" ("+p.precio+")");
  n.append(h,pr,a);c.append(f,n);g.appendChild(c);
});
var t=document.getElementById("tel");t.textContent=CELULAR_VISIBLE;t.href="tel:+"+CELULAR;
var r=document.getElementById("redes");
REDES.forEach(function(x){var a=document.createElement("a");a.className="red";a.href=x.url;a.target="_blank";a.rel="noopener";a.textContent=x.nombre;r.appendChild(a)});
document.getElementById("fab").href=wa("Hola Alex, quiero hacer un pedido de gorras");
